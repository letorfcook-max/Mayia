name: MAYIA Native Mac Build
on:
  push:
    branches: ['mayia-build/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --ignore-scripts=false --no-audit --no-fund; else npm install --include=dev --ignore-scripts=false --no-audit --no-fund; fi
      - run: npm run check
      - name: Build both native Mac architectures
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify both DMGs
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            files=(release/*-${arch}.dmg)
            test -f "${files[0]}"
            hdiutil verify "${files[0]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
